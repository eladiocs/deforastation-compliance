services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: deforcompliance
      POSTGRES_USER: deforcompliance
      POSTGRES_PASSWORD: deforcompliance
    ports:
      - "5434:5432"
    volumes:
      - deforcompliance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deforcompliance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://deforcompliance:deforcompliance@db:5432/deforcompliance
      PYTHONPATH: /app
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL}
      GEE_KEY_PATH: secrets/gee-key.json
      GEE_PROJECT_ID: ${GEE_PROJECT_ID}
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  api-corredores:
    build: ./backend-corredores
    environment:
      # Misma base de datos que "api" (Supabase no permite un segundo proyecto);
      # este servicio gestiona únicamente su propio schema "corredores".
      DATABASE_URL: postgresql+psycopg://deforcompliance:deforcompliance@db:5432/deforcompliance
      CORS_ORIGINS: "http://localhost:5174"
      PYTHONPATH: /app
    ports:
      - "8100:8000"
    volumes:
      - ./backend-corredores:/app
    depends_on:
      db:
        condition: service_healthy

  api-inmuebles:
    build: ./backend-inmuebles
    environment:
      # Misma base de datos que "api" (Supabase no permite un segundo proyecto);
      # este servicio gestiona únicamente su propio schema "inmuebles".
      DATABASE_URL: postgresql+psycopg://deforcompliance:deforcompliance@db:5432/deforcompliance
      CORS_ORIGINS: "http://localhost:5174"
      PYTHONPATH: /app
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL}
      GEE_KEY_PATH: secrets/gee-key.json
      GEE_PROJECT_ID: ${GEE_PROJECT_ID}
    ports:
      - "8200:8000"
    volumes:
      - ./backend-inmuebles:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  deforcompliance_db_data:
