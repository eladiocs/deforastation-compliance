services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: deforcompliance
      POSTGRES_USER: deforcompliance
      POSTGRES_PASSWORD: deforcompliance
    ports:
      - "5434:5432"
    volumes:
      - deforcompliance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deforcompliance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://deforcompliance:deforcompliance@db:5432/deforcompliance
      PYTHONPATH: /app
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL}
      GEE_KEY_PATH: secrets/gee-key.json
      GEE_PROJECT_ID: ${GEE_PROJECT_ID}
      REPORTS_DIR: /app/reports
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  deforcompliance_db_data:
